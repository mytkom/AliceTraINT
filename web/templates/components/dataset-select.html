{{ define "dataset_select" }}
<div class="dataset-select" data-dataset-select="{{ .SearchURL }}">
    <label for="{{ .ID }}-search">Search datasets
        <input type="search" id="{{ .ID }}-search" autocomplete="off" aria-controls="{{ .ID }}"
               aria-describedby="{{ .ID }}-status">
    </label>
    <label for="{{ .ID }}">Training dataset
        <select id="{{ .ID }}" name="{{ .Name }}"{{ if .Required }} required{{ end }}>
            <option value="">{{ .EmptyLabel }}</option>
            {{ range .Choices }}
            <option value="{{ .ID }}"{{ if eq .ID $.Selected }} selected{{ end }}>{{ .Name }}</option>
            {{ end }}
        </select>
    </label>
    <small id="{{ .ID }}-status" role="status"></small>
</div>
{{ end }}
