{{ define "training-tasks_index" }}
{{ template "header" . }}
<section class="task-list">
    <header class="task-list-heading">
        <h1>Training tasks</h1>
        <a class="task-list-create" href="/training-tasks/new">Create Training Task</a>
    </header>
    <form method="get" class="task-list-scope">
        <label for="userScoped">Show only mine</label>
        <input id="userScoped" type="checkbox" name="userScoped" hx-get="/training-tasks/list" hx-trigger="click"
            hx-target="#training-tasks-listing" hx-indicator="#spinner">
    </form>
    <div class="task-list-panel">
        <div id="spinner" class="display-htmx-indicator task-list-notice" role="status">Loading training tasks…</div>
        <div id="training-tasks-listing" hx-get="/training-tasks/list" hx-trigger="load" hx-indicator="#spinner"></div>
        <p id="task-list-error" class="task-list-notice" role="alert" hidden>Training tasks could not be loaded.</p>
    </div>
    <script>
        (() => {
            const list = document.querySelector('.task-list');
            const error = document.getElementById('task-list-error');
            list.addEventListener('htmx:beforeRequest', () => { error.hidden = true; });
            list.addEventListener('htmx:afterRequest', (event) => { error.hidden = event.detail.successful; });
        })();
    </script>
</section>
{{ template "footer" . }}
{{ end }}
