{{ define "training-tasks_index" }}
{{ template "header" . }}
<section class="task-list">
    <header class="task-list-heading">
        <h1>Training tasks</h1>
        <a class="task-list-create" href="/training-tasks/new">Create Training Task</a>
    </header>
    <form method="get" action="/training-tasks" class="task-list-filters" autocomplete="off">
        <label>Task name <input type="search" name="name" value="{{ .Params.Get "name" }}"></label>
        <label>Created by <input type="search" name="author" value="{{ .Params.Get "author" }}"></label>
        <label>Status
            <select name="status">
                <option value="">All statuses</option>
                {{ range .StatusOptions }}
                <option value="{{ .Value }}"{{ if eq .Value ($.Params.Get "status") }} selected{{ end }}>{{ .Label }}</option>
                {{ end }}
            </select>
        </label>
        <label>Created from (UTC) <input type="date" name="from" value="{{ .Params.Get "from" }}"></label>
        <label>Created through (UTC) <input type="date" name="to" value="{{ .Params.Get "to" }}"></label>
        <label>Sort by
            <select name="sort">
                {{ range .SortOptions }}
                <option value="{{ .Value }}"{{ if eq .Value $.Sort }} selected{{ end }}>{{ .Label }}</option>
                {{ end }}
            </select>
        </label>
        {{ template "dataset_select" .DatasetSelect }}
        <div class="task-list-actions">
            <button type="submit">Apply</button>
            <a href="/training-tasks">Clear</a>
        </div>
    </form>
    <div class="task-list-panel">
        <div id="spinner" class="display-htmx-indicator task-list-notice" role="status">Loading training tasks…</div>
        <div id="training-tasks-listing" hx-get="{{ .ListURL }}" hx-trigger="load" hx-indicator="#spinner"></div>
        <p id="task-list-error" class="task-list-notice" role="alert" hidden>Training tasks could not be loaded.</p>
    </div>
    <script src="/static/js/dataset-select.js" defer></script>
    <script>
        (() => {
            const list = document.querySelector('.task-list');
            window.addEventListener('pageshow', (event) => {
                if (event.persisted) list.querySelector('form').reset();
            });
            const error = document.getElementById('task-list-error');
            list.addEventListener('htmx:beforeRequest', () => { error.hidden = true; });
            list.addEventListener('htmx:afterRequest', (event) => { error.hidden = event.detail.successful; });
        })();
    </script>
</section>
{{ template "footer" . }}
{{ end }}
