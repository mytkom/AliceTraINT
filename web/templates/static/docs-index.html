{{ define "docs_index" }}
{{ template "header" . }}
<div class="flex flex-col gap-4 my-4">
    <div class="flex flex-col-reverse justify-start gap-4 md:flex-row md:justify-between items-center">
        <h1 class="text-xl">{{ .Title }}</h1>
    </div>

    <div class="flex flex-col gap-2">
        <p class="text-gray-600 dark:text-gray-300">
            No documentation pages found. Add pages in numbered group folders of the configured docs directory,
            for example <code>docs/1-user-guide/1-getting-started.md</code>.
        </p>
    </div>
</div>
{{ template "footer" . }}
{{ end }}
